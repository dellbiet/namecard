<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Card</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      /* Reset cơ bản */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        /* Dùng màu nền hơi tối lại một chút để các khối đổ bóng đen nhìn rõ mồn một */
        background: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Bảng màu chuẩn từ image_f60419.png */
      :root {
        --color-1: #ff9f43; /* Cam */
        --color-2: #10ac84; /* Xanh lá */
        --color-3: #2e86de; /* Xanh dương */
        --color-4: #0abde3; /* Xanh cyan */
        --color-5: #ee5253; /* Hồng/Đỏ */
        --color-purple: #9c88ff; /* Tím */
      }

      /* Khung mô phỏng điện thoại */
      .phone-container {
        width: 365px;
        height: 780px;
        background: #f1f5f9; /* Nền trong máy xám nhạt để tương phản với khối trắng */
        border-radius: 40px;
        /* Đổ bóng cực mạnh cho toàn bộ chiếc điện thoại */
        box-shadow:
          0 40px 80px -20px rgba(0, 0, 0, 0.25),
          inset 0 2px 5px rgba(255, 255, 255, 1);
        padding: 30px 22px;
        display: flex;
        flex-direction: column;
      }

      .profile-card {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* --- PHẦN 1: PROFILE VÀ QR CHUYỂN LÊN ĐẦU --- */
      .top-info {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 25px;
        position: relative;
      }

      /* Avatar bên góc trái */
      .info-section {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 1;
        padding-right: 15px;
      }

      .avatar-container {
        position: relative;
        width: 100px;
        height: 100px;
        background: #ffffff;
        border-radius: 28px;
        padding: 6px;
        margin-bottom: 10px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        /* Kỹ thuật đổ bóng đa lớp tích tụ: Bóng càng gần càng đậm, bóng ra xa mờ dần */
        box-shadow:
          0 4px 6px -1px rgba(156, 136, 255, 0.2),
          0 12px 24px -4px rgba(156, 136, 255, 0.35),
          0 20px 40px -10px rgba(156, 136, 255, 0.2);
      }

      .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 22px;
        overflow: hidden;
        border: 2px solid var(--color-purple);
      }

      .avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .name {
        font-size: 19px;
        font-weight: 800;
        color: #1e293b;
        letter-spacing: 0.5px;
        margin-top: 5px;
      }

      .color-dots {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      /* Khối QR lên cạnh avatar */
      .qr-zone {
        width: 125px;
        height: 125px;
        background: #ffffff;
        border-radius: 20px;
        padding: 10px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 0;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      }

      .qr-zone img {
        width: 100%;
        display: block;
        border-radius: 12px;
      }

      /* --- PHẦN 2: THÔNG TIN CÔNG TY MỚI --- */
      .company-block {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-bottom: 25px;
      }

      .company-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 15px 18px;
        box-shadow:
          0 2px 2px rgba(0, 0, 0, 0.05),
          0 6px 10px rgba(0, 0, 0, 0.08);
      }

      .company-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--color-purple);
        margin-bottom: 5px;
      }

      .company-detail {
        font-size: 12px;
        color: #64748b;
        line-height: 1.4;
      }

      .company-web-link {
        color: var(--color-3);
        text-decoration: none;
        word-break: break-all;
      }
      .company-web-link:hover {
        text-decoration: underline;
      }

      /* --- PHẦN 3: DANH SÁCH KHỐI LIÊN KẾT NỔI 3D + BÓNG ĐỔ ĐA TẦNG ĐẬM --- */
      .links-list {
        display: flex;
        flex-direction: column;
        gap: 18px; /* Giãn rộng để bóng đổ không đè lên nhau */
        margin-bottom: 20px;
        /* Bật chế độ môi trường không gian 3D */
        perspective: 1000px;
      }

      .link-item-card {
        position: relative;
        display: block;
        text-decoration: none;
        background: #ffffff;
        border-radius: 16px;
        height: 52px;
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);

        /* ĐỔ BÓNG KHỐI 3D ĐẬM ĐẶC (LAYERED AMBIENT OCCLUSION) */
        box-shadow:
          0 2px 2px rgba(0, 0, 0, 0.05),
          /* Bóng sát chân khối */ 0 8px 12px -2px rgba(0, 0, 0, 0.1),
          /* Bóng thân khối đổ xuống */ 0 16px 20px -6px rgba(0, 0, 0, 0.12); /* Vùng mù tối lan rộng phía dưới */

        /* Tạo viền nhựa màu bọc quanh chân khối để tạo độ dày góc nhìn */
        border-left: 15px solid transparent;
      }

      /* Đổ màu chân khối riêng biệt từng hàng */
      .item-1 {
        border-left-color: var(--color-1);
      }
      .item-2 {
        border-left-color: var(--color-2);
      }
      .item-3 {
        border-left-color: var(--color-3);
      }
      .item-4 {
        border-left-color: var(--color-4);
      }
      .item-5 {
        border-left-color: var(--color-5);
      }

      .card-inner-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: #ffffff;
        border-radius: 0 14px 14px 0;
        /* Tạo vết lõm nhẹ bên trong lòng khối */
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      }

      .link-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      /* Khối vuông chứa icon dạng nút nhấn 3D thu nhỏ */
      .icon-box-3d {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-size: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      }

      .item-1 .icon-box-3d {
        background: var(--color-1);
      }
      .item-2 .icon-box-3d {
        background: var(--color-2);
      }
      .item-3 .icon-box-3d {
        background: var(--color-3);
      }
      .item-4 .icon-box-3d {
        background: var(--color-4);
      }
      .item-5 .icon-box-3d {
        background: var(--color-5);
      }

      .link-left span {
        font-size: 14px;
        font-weight: 700;
        color: #334155;
      }

      .arrow-right {
        width: 7px;
        height: 7px;
        border-right: 2.5px solid #94a3b8;
        border-bottom: 2.5px solid #94a3b8;
        transform: rotate(-45deg);
      }

      /* --- HIỆU ỨNG NHẤN NÚT VẬT LÝ KHI HOVER/ACTIVE --- */
      /* Khi rê chuột: Khối nhấc cao lên -> Bóng đổ giãn rộng ra và nhạt đi */
      .link-item-card:hover {
        transform: translateY(-4px) translateZ(10px);
        box-shadow:
          0 4px 4px rgba(0, 0, 0, 0.04),
          0 16px 22px -4px rgba(0, 0, 0, 0.15),
          0 28px 36px -8px rgba(0, 0, 0, 0.18);
      }

      /* Khi click bấm vào: Khối thụt hẳn xuống sát sàn -> Bóng biến mất */
      .link-item-card:active {
        transform: translateY(2px) translateZ(0);
        box-shadow:
          0 1px 1px rgba(0, 0, 0, 0.05),
          0 3px 6px rgba(0, 0, 0, 0.08);
      }

      /* --- PHẦN 4: KHỐI BOTTOM LIÊN HỆ --- */
      .contact-container {
        margin-top: auto;
        text-align: center;
      }

      /* Nút bấm dốc 3D có thềm nhựa dày */
      .action-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(
          180deg,
          #b3a5ff 0%,
          var(--color-purple) 100%
        );
        border: none;
        border-radius: 18px;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.5px;
        /* Phần thềm nhựa dày màu tối phía dưới */
        border-bottom: 4px solid #7d66f0;
        box-shadow:
          0 10px 20px -4px rgba(156, 136, 255, 0.4),
          0 4px 6px rgba(0, 0, 0, 0.05);
        transition: all 0.1s ease;
      }

      .action-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 25px -4px rgba(156, 136, 255, 0.5);
      }

      .action-btn:active {
        transform: translateY(3px);
        border-bottom-width: 1px; /* Thềm nhựa lún xuống sát sàn */
        box-shadow: 0 4px 8px rgba(156, 136, 255, 0.3);
      }
    </style>
  </head>

  <body>

    </div>
  </body>
