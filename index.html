  background: linear-gradient(135deg, #5f2c82, #49a09d);

  align-items: center;

.container {

.link-item {

  gap: 10px;

  color: white;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
  text-decoration: none;
  transition: 0.3s;
}

.link-item:hover {

}

.link-item i {
