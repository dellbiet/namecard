<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Card</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      /* Reset cơ bản */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #eef2f7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      :root {
        --text-main: #1e293b;
        --text-sub: #64748b;

        /* Màu nền đổ bóng chuẩn Neumorphism mượt */
        --bg-color: #eef2f7;
        --shadow-dark: #d1d9e6;
        --shadow-light: #ffffff;

        /* Màu loang lỏng khi Hover nhẹ */
        --liquid-blue: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
        --liquid-green: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
        --liquid-red: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 100%);
        --liquid-orange: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        --liquid-purple: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);

        --icon-blue: #0284c7;
        --icon-green: #16a34a;
        --icon-red: #dc2626;
        --icon-orange: #ea580c;
        --icon-purple: #9333ea;

        /* CHÌA KHÓA SMOOTH: Đường cong Bezier giả lập độ đàn hồi vật lý */
        --smooth-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        --smooth-click: cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Khung điện thoại nổi lồi dẻo */
      .phone-container {
        width: 365px;
        height: 780px;
        background: var(--bg-color);
        border-radius: 44px;
        padding: 30px 22px;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow:
          12px 12px 24px var(--shadow-dark),
          -12px -12px 24px var(--shadow-light);
      }

      .profile-card {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* --- PROFILE VÀ QR --- */
      .top-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .info-section {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .avatar-container {
        width: 80px;
        height: 80px;
        background: var(--bg-color);
        border-radius: 26px;
        padding: 6px;
        margin-bottom: 12px;
        box-shadow:
          4px 4px 8px var(--shadow-dark),
          -4px -4px 8px var(--shadow-light);
      }

      .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 20px;
        overflow: hidden;
      }

      .avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .name {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-main);
        letter-spacing: 0.3px;
      }

      .qr-zone {
        width: 105px;
        height: 105px;
        background: var(--bg-color);
        border-radius: 22px;
        padding: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow:
          6px 6px 12px var(--shadow-dark),
          -6px -6px 12px var(--shadow-light);
      }

      .qr-zone img {
        width: 100%;
        display: block;
        border-radius: 12px;
      }

      /* --- KHỐI THÔNG TIN CÔNG TY (LÚN) --- */
      .company-block {
        margin-bottom: 22px;
      }

      .company-card {
        background: var(--bg-color);
        border-radius: 20px;
        padding: 16px;
        box-shadow:
          inset 3px 3px 6px var(--shadow-dark),
          inset -3px -3px 6px var(--shadow-light);
      }

      .company-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
      }

      .company-detail {
        font-size: 12px;
        color: var(--text-sub);
        line-height: 1.5;
      }

      .company-web-link {
        color: #0284c7;
        text-decoration: none;
        font-weight: 600;
      }

      /* --- DANH SÁCH NÚT NỔI KHỐI SIÊU MƯỢT --- */
      .links-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 20px;
      }

      .link-item-card {
        position: relative;
        display: block;
        text-decoration: none;
        background: var(--bg-color);
        border-radius: 20px;
        height: 56px;

        /* Trạng thái tĩnh: Bóng nổi khối rõ ràng */
        box-shadow:
          6px 6px 12px #cbd5e1,
          -6px -6px 12px var(--shadow-light);

        /* Ép trình duyệt tối ưu hóa phần cứng đồ họa (GPU) để chạy mượt hơn */
        will-change: transform, box-shadow, background-color;

        /* Thiết lập chuyển động mượt mà đàn hồi cho tất cả thuộc tính */
        transition:
          transform 0.4s var(--smooth-elastic),
          box-shadow 0.4s var(--smooth-elastic),
          background-color 0.4s ease;
      }

      .card-inner-content {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
      }

      .link-left {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--text-main);
      }

      /* Icon chìm lún nhẹ */
      .icon-box-liquid {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-color);
        color: var(--text-sub);
        font-size: 13px;
        box-shadow:
          inset 2px 2px 4px var(--shadow-dark),
          inset -2px -2px 4px var(--shadow-light);
        transition: color 0.3s ease;
      }

      .link-left span {
        font-size: 14px;
        font-weight: 700;
      }

      .arrow-right {
        width: 6px;
        height: 6px;
        border-right: 2.5px solid var(--text-sub);
        border-bottom: 2.5px solid var(--text-sub);
        transform: rotate(-45deg);
        opacity: 0.6;
        transition:
          transform 0.3s var(--smooth-elastic),
          opacity 0.3s ease;
      }

      /* --- HIỆU ỨNG HOVER: LÚN XUỐNG MƯỢT MÀ --- */

      .link-item-card:hover {
        /* Khi di chuột vào: Nút lún nhẹ đều xuống sàn tạo phản hồi 2D */
        transform: translateY(2px);
      }

      .item-blue:hover {
        background: var(--liquid-blue);
        box-shadow:
          inset 4px 4px 8px #cbd5e1,
          inset -4px -4px 8px var(--shadow-light);
      }
      .item-blue:hover .icon-box-liquid {
        color: var(--icon-blue);
      }

      .item-green:hover {
        background: var(--liquid-green);
        box-shadow:
          inset 4px 4px 8px #cbd5e1,
          inset -4px -4px 8px var(--shadow-light);
      }
      .item-green:hover .icon-box-liquid {
        color: var(--icon-green);
      }

      .item-red:hover {
        background: var(--liquid-red);
        box-shadow:
          inset 4px 4px 8px #cbd5e1,
          inset -4px -4px 8px var(--shadow-light);
      }
      .item-red:hover .icon-box-liquid {
        color: var(--icon-red);
      }

      .item-orange:hover {
        background: var(--liquid-orange);
        box-shadow:
          inset 4px 4px 8px #cbd5e1,
          inset -4px -4px 8px var(--shadow-light);
      }
      .item-orange:hover .icon-box-liquid {
        color: var(--icon-orange);
      }

      .item-purple:hover {
        background: var(--liquid-purple);
        box-shadow:
          inset 4px 4px 8px #cbd5e1,
          inset -4px -4px 8px var(--shadow-light);
      }
      .item-purple:hover .icon-box-liquid {
        color: var(--icon-purple);
      }

      .link-item-card:hover .arrow-right {
        opacity: 1;
        transform: translateX(3px) rotate(-45deg);
      }

      /* --- HIỆU ỨNG CLICK (ACTIVE): ÉP CHẶT HOÀN TOÀN --- */
      .link-item-card:active {
        /* Chuyển sang hiệu ứng click nhanh, gãy gọn để có cảm giác bấm nút thật */
        transition:
          transform 0.1s var(--smooth-click),
          box-shadow 0.1s var(--smooth-click);
        transform: translateY(4px) scale(0.98);
        box-shadow:
          inset 6px 6px 12px #cbd5e1,
          inset -6px -6px 12px var(--shadow-light);
      }

      /* --- NÚT ACTION LIÊN HỆ DƯỚI ĐÁY --- */
      .contact-container {
        margin-top: auto;
      }

      .action-btn {
        width: 100%;
        padding: 16px;
        background: var(--bg-color);
        border: none;
        border-radius: 22px;
        color: var(--icon-purple);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        will-change: transform, box-shadow;
        transition:
          transform 0.4s var(--smooth-elastic),
          box-shadow 0.4s var(--smooth-elastic),
          background-color 0.4s ease;

        box-shadow:
          6px 6px 12px #cbd5e1,
          -6px -6px 12px var(--shadow-light);
      }

      .action-btn:hover {
        transform: translateY(2px);
        background: var(--liquid-purple);
        box-shadow:
          inset 4px 4px 8px #cbd5e1,
          inset -4px -4px 8px var(--shadow-light);
      }

      .action-btn:active {
        transition:
          transform 0.1s var(--smooth-click),
          box-shadow 0.1s var(--smooth-click);
        transform: translateY(4px) scale(0.97);
        box-shadow:
          inset 6px 6px 12px #cbd5e1,
          inset -6px -6px 12px var(--shadow-light);
      }
    </style>
  </head>

  <body>

      </div>
    </div>
  </body>
</html>
